<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>醫師回覆</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="醫師回覆">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ff;font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#1f2937;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
h2{color:#5b21b6;margin:6px 0}
.btn{display:inline-block;font:inherit;font-size:16px;border:1px solid #c4b5fd;background:#fff;color:#4c1d95;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none}
.btn.go{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:bold;width:100%;font-size:18px;padding:14px;margin-top:10px}
.btn:disabled{opacity:.5}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;margin-top:4px;font-family:inherit}
label{display:block;margin:10px 0;font-size:15px}
.xdel{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer}
.card{background:#fff;border:1px solid #ddd6fe;border-left:6px solid #7c3aed;border-radius:14px;padding:13px 14px;margin:10px 0}
.card.done{border-left-color:#16a34a;border-color:#e5e7eb}
.card .t{font-weight:bold;font-size:16px}
.card .s{font-size:13px;color:#64748b;margin-top:3px}
.box{border-radius:14px;padding:13px 14px;margin:12px 0;font-size:15px;line-height:1.65}
.warn{background:#fef3c7}.ok{background:#f0fdf4}.info{background:#ede9fe}
.msg{color:#b3261e;min-height:1.3em;margin-top:8px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.small{font-size:13px;color:#64748b}
#alert{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));background:#fff;border-left:6px solid #16a34a;border-radius:12px;box-shadow:0 10px 30px #0004;padding:12px 14px;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap" id="app">載入中…</div>
<div id="alert"></div>
<script>
/* ===== 設定：Apps Script 網頁應用程式網址 ===== */
const API = 'https://script.google.com/macros/s/AKfycbw-mtqUpmnx5cebffRXbNnJNhDmYhsfywumMYIDFWaAH0e6lOtjoh-AKtYK3dNBNb2v/exec';
const VERSION = '1030-v136';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, del: k => { try { localStorage.removeItem(k) } catch (e) {} } };
async function call(fn, ...args){
  let r;
  try { r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow' }) }
  catch (e) { throw new Error('無法連線，請確認網路') }
  const j = await r.json().catch(() => { throw new Error('系統回應異常，請稍後再試') });
  if (j.error) throw new Error(j.error);
  return j.result;
}
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

// 帳號金鑰：網址 ?k=… 優先，並記在這支手機
const q = new URLSearchParams(location.search);
let KEY = (q.get('k') || '').replace(/[^A-Za-z0-9]/g, '') || ls.get('appKey') || '';
if (q.get('k')) ls.set('appKey', KEY);
if (q.has('logout')) { ls.del('appKey'); KEY = ''; history.replaceState(null, '', location.pathname) }

// 把帳號金鑰交給背景通知程式（service worker），推播來時才能取回通知文字
function keyToSW(){ try { const r = indexedDB.open('pda', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { try { const t = r.result.transaction('kv', 'readwrite'); t.objectStore('kv').put(KEY || '', 'key') } catch (e) {} } } catch (e) {} }
keyToSW();
let swReg = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r }).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', () => load());

function showAlert(html){ const a = $('alert'); a.innerHTML = html + '<div style="text-align:right"><button class="btn" onclick="this.closest(\'#alert\').style.display=\'none\'">好</button></div>'; a.style.display = 'block'; try { navigator.vibrate && navigator.vibrate([200, 100, 200]) } catch (e) {} }

/* ---------- 登錄 ---------- */
function fixDeng(el){ let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); const a = v.slice(0, 3).replace(/[^A-Z]/g, ''), b = a.length === 3 ? v.slice(3).replace(/[^0-9]/g, '') : ''; el.value = a + b }
function regView(){
  $('app').innerHTML = `<h2>📲 醫師回覆 APP</h2><div class="small" style="font-size:15px;line-height:1.6">登錄後由承辦人核准，就能在這裡收到需要回覆的表單，直接填寫、簽章、回傳；APP 關著時也會跳通知。</div>
    <label>醫師姓名 *<input id="rgName" autocomplete="name"></label>
    <label>燈號 *<span class="small">（前 3 碼英文大寫＋數字，例如 ABC1234）</span><input id="rgPhone" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC1234" maxlength="12" style="text-transform:uppercase;letter-spacing:1px"></label>
    <label>Email（有新表單時寄提醒，可空白）<input id="rgEmail" type="email" autocomplete="email"></label>
    <div class="msg" id="rgMsg"></div><button class="btn go" id="rgGo">✅ 登錄</button>
    <div class="small" style="margin-top:14px;text-align:center">版本 ${VERSION}</div>`;
  $('rgPhone').oninput = () => fixDeng($('rgPhone'));
  $('rgGo').onclick = async () => {
    const name = $('rgName').value.trim(); if (!name) return ($('rgMsg').textContent = '請輸入醫師姓名');
    if (!/^[A-Z]{3}\d+$/.test($('rgPhone').value.trim())) return ($('rgMsg').textContent = '燈號格式：前 3 碼英文大寫，後面為數字（例如 ABC1234）');
    $('rgGo').disabled = true; $('rgMsg').textContent = '登錄中…';
    try {
      const r = await call('appRegister', name, '', $('rgEmail').value.trim(), $('rgPhone').value.trim());
      KEY = r.key; ls.set('appKey', KEY); keyToSW();
      location.replace(location.pathname + '?k=' + KEY);   // 網址帶專屬帳號，加入主畫面後也記得
    } catch (e) { $('rgGo').disabled = false; $('rgMsg').textContent = e.message }
  };
}

/* ---------- 通知 ---------- */
function pushBox(){
  if (!canPush) return isIOS && !standalone ? '' : `<div class="box warn">這支手機的瀏覽器不支援背景通知，請改用 Chrome（Android）或把 APP 加到主畫面（iPhone）。</div>`;
  if (isIOS && !standalone) return '';
  if (Notification.permission === 'granted' && ls.get('pushOn_' + KEY)) return `<div class="small" style="margin:6px 0">🔔 通知已開啟</div>`;
  if (Notification.permission === 'denied') return `<div class="box warn">🔕 通知已被關閉。請到手機「設定 → 通知 → 醫師回覆」開啟。</div>`;
  return `<div class="box info"><b>🔔 開啟通知</b><br>有新表單時，APP 關著也會跳通知。<button class="btn go" id="pushGo">🔔 開啟通知</button><div class="msg" id="pushMsg"></div></div>`;
}
async function enablePush(){
  const m = $('pushMsg'); m.textContent = '設定中…';
  try {
    if ((await Notification.requestPermission()) !== 'granted') throw new Error('沒有允許通知');
    const reg = swReg || await navigator.serviceWorker.ready;
    const pub = await call('appVapid');
    const key = Uint8Array.from(atob(pub.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((pub.length + 3) % 4)), c => c.charCodeAt(0));
    let sub = await reg.pushManager.getSubscription();
    if (sub) { try { await sub.unsubscribe() } catch (e) {} }
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    await call('appSaveSub', KEY, sub.toJSON());
    ls.set('pushOn_' + KEY, '1');
    m.style.color = '#15803d'; m.textContent = '✅ 已開啟，稍後會收到一則測試通知';
    setTimeout(load, 1500);
  } catch (e) { m.textContent = '無法開啟：' + e.message }
}
function a2hsBox(){
  // 已從主畫面開啟、已開啟通知、或按過「已加入」就不再顯示
  if (standalone || ls.get('a2hsDone') || (window.Notification && Notification.permission === 'granted' && ls.get('pushOn_' + KEY))) return '';
  return `<div class="box info"><b>📲 先把 APP 加到主畫面</b><br>` +
    (isIOS ? '1. 用 <b>Safari</b> 開啟此頁<br>2. 按下方 <b>分享鍵 ⬆️</b> →「<b>加入主畫面</b>」→「新增」<br>3. 從主畫面的「醫師回覆」圖示打開，再按「🔔 開啟通知」'
           : '1. 按右上角 <b>⋮</b> →「<b>安裝應用程式</b>」或「加到主畫面」<br>2. 從主畫面的「醫師回覆」圖示打開，再按「🔔 開啟通知」') +
    `<div class="small" style="margin-top:6px">請在「這個畫面」加入主畫面（已記住您的帳號）。</div>` +
    `<div style="text-align:right;margin-top:6px"><button class="btn" style="padding:6px 12px;font-size:14px" onclick="localStorage.setItem('a2hsDone','1');this.closest('.box').remove()">✓ 已加入，不再顯示</button></div></div>`;
}

/* 填寫連結：去掉 &app=（舊版雲端程式會誤開成 APP 首頁），直接打開填寫簽章畫面 */
const fillLink = u => { const s = String(u || ''), i = s.indexOf('?'); return i < 0 ? s : 'go.html#' + s.slice(i + 1) };   // 經 go.html 開啟，不受手機登入多個 Google 帳號影響
/* ---------- 管理者：檢視回覆內容（已隱蔽個資版） ---------- */
let pdfjsReady = null;
function loadPdfjs(){
  if (pdfjsReady) return pdfjsReady;
  return pdfjsReady = new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok() }; sc.onerror = () => no(new Error('檢視元件載入失敗')); document.head.appendChild(sc) });
}
async function viewReply(id, btn, form){
  const old = btn.textContent; btn.disabled = true; btn.textContent = '載入中…';
  try {
    const [r] = await Promise.all([form ? call('appMgrCase', KEY, id, 'view') : call('appViewReply', KEY, id), loadPdfjs()]);
    const bytes = Uint8Array.from(atob(r.pdfBase64), c => c.charCodeAt(0));
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:20;background:#334155;overflow:auto;-webkit-overflow-scrolling:touch';
    ov.innerHTML = `<div style="position:sticky;top:0;background:#1e293b;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="font-size:14px"><b>${form ? '處理中表單｜' + esc(r.doctor || '') + ' 醫師' : esc(r.doctor || '') + ' 醫師的回覆'}</b><br>${esc(r.title)}<span style="color:#94a3b8">（已隱蔽個資）</span></div><button class="btn" style="padding:7px 14px">✕ 關閉</button></div><div class="pv" style="padding:10px"></div>`;
    document.body.appendChild(ov); ov.querySelector('button').onclick = () => ov.remove();
    const doc = await pdfjsLib.getDocument({ data: bytes, cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked: true }).promise;
    for (let i = 1; i <= doc.numPages; i++) {
      const pg = await doc.getPage(i), w = Math.min(window.innerWidth - 20, 900), vp0 = pg.getViewport({ scale: 1 }), sc = w / vp0.width * (window.devicePixelRatio || 1), vp = pg.getViewport({ scale: sc });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.cssText = `width:${w}px;display:block;margin:0 auto 10px;background:#fff;border-radius:4px`;
      ov.querySelector('.pv').appendChild(c); await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) { showAlert(`<b style="color:#b3261e">無法檢視</b><br>${esc(e.message)}`) }
  finally { btn.disabled = false; btn.textContent = old }
}

/* ---------- 我的表單 ---------- */
/** 管理者：分派胸部X光判讀醫師（選 APP 醫師，或輸入姓名＋Email） */
function dispatchDlg(qid){
  const docs = window.__docs || [], a = $('alert');
  a.innerHTML = `<b style="color:#b45309">👩‍⚕️ 分派判讀醫師</b><div class="small" style="margin:6px 0">選擇有 APP 的醫師，或直接輸入醫師姓名＋Email（系統寄 Email 通知；醫師有 APP 也會推播）。</div>` +
    `<label>APP 醫師<select id="dpDoc" style="width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-top:4px"><option value="">（不選，改輸入 Email）</option>${docs.map(d => `<option value="${esc(d.key)}">${esc(d.name)}${d.dept ? '｜' + esc(d.dept) : ''}${d.email ? '' : '（無 Email，只推播 APP）'}</option>`).join('')}</select></label>` +
    `<label>醫師姓名<input id="dpName" placeholder="例如：馮嘉毅"></label><label>醫師 Email<input id="dpMail" type="email" placeholder="name@vghtpe.gov.tw"></label>` +
    `<div id="dpMsg" style="color:#b3261e;min-height:20px;font-size:14px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="dpX">取消</button><button class="btn" id="dpOk" style="background:#f59e0b;color:#fff;border-color:#f59e0b;font-weight:bold">送出分派</button></div>`;
  a.style.display = 'block';
  $('dpX').onclick = () => { a.style.display = 'none' };
  $('dpOk').onclick = async () => {
    const k = $('dpDoc').value, n = $('dpName').value.trim(), m = $('dpMail').value.trim();
    if (!k && !m) return ($('dpMsg').textContent = '請選擇 APP 醫師，或輸入醫師 Email');
    $('dpOk').disabled = true; $('dpOk').textContent = '送出中…';
    try { const r = await call('appDispatch', KEY, qid, { doctorKey: k, doctorName: n, doctorEmail: m }); a.innerHTML = `<b style="color:#166534">✅ ${esc(r.msg)}</b><div style="text-align:right"><button class="btn" onclick="this.closest('#alert').style.display='none'">好</button></div>`; load() }
    catch (e) { $('dpMsg').textContent = e.message; $('dpOk').disabled = false; $('dpOk').textContent = '送出分派' }
  };
}
let first = true;
async function load(){
  if (!KEY) return regView();
  if (first) $('app').innerHTML = '<h2>📲 我的表單</h2><div class="small">載入中…</div>';
  let r;
  try { r = await call('appInbox', KEY) }
  catch (e) {
    if (/找不到這個 APP 帳號/.test(e.message)) { ls.del('appKey'); KEY = ''; return regView() }
    if (first) $('app').innerHTML = `<h2>📲 我的表單</h2><div class="box warn">${esc(e.message)}</div><button class="btn" onclick="load()">🔄 重試</button>`;
    return;
  }
  const head = `<div class="top"><h2>📲 我的表單</h2><button class="btn" id="refBtn" style="padding:7px 12px">🔄</button></div><div class="small" style="font-size:14px">${esc(r.me.name)} 醫師${r.me.phone ? '｜燈號 ' + esc(r.me.phone) : ''}</div>`;
  if (r.me.status !== '啟用') {
    $('app').innerHTML = head + `<div class="box warn">⏳ 帳號${r.me.status === '停用' ? '已停用，請聯絡承辦人' : '等待承辦人核准中'}。<br>核准後，新的表單會出現在這裡。</div>` + a2hsBox() + pushBox();
  } else {
    // 從名單移除（只是不顯示在這支手機的 APP，不會刪除表單或影響承辦人）
    let hid = []; try { hid = JSON.parse(ls.get('hid_' + KEY) || '[]') } catch (e) {}
    const H = new Set(hid), showHid = window.__showHid;
    const vis = (pre, list) => showHid ? list : list.filter(x => !H.has(pre + x.id));
    const nHid = r.cases.filter(c => H.has('c:' + c.id)).length + (r.replies || []).filter(x => H.has('r:' + x.id)).length + (r.active || []).filter(x => H.has('a:' + x.id)).length;
    const delBtn = (k) => `<button class="xdel" data-hide="${esc(k)}" title="從名單移除">${H.has(k) ? '↩' : '🗑'}</button>`;
    const todo = vis('c:', r.cases.filter(c => c.status !== '已回傳')), done = vis('c:', r.cases.filter(c => c.status === '已回傳'));
    let seen = null; try { seen = JSON.parse(ls.get('seen_' + KEY) || 'null') } catch (e) {}
    const fresh = seen ? todo.filter(c => !seen.includes(c.id)) : [];
    ls.set('seen_' + KEY, JSON.stringify(todo.map(c => c.id)));
    if (fresh.length && !first) showAlert(`<b style="color:#166534">📩 有 ${fresh.length} 份新表單</b><br>${fresh.map(c => '・' + esc(c.title)).join('<br>')}`);
    try { if (navigator.setAppBadge) todo.length ? navigator.setAppBadge(todo.length) : navigator.clearAppBadge() } catch (e) {}
    const card = (c, isTodo) => `<div class="card${isTodo ? '' : ' done'}" style="position:relative">${delBtn('c:' + c.id)}<div class="t" style="padding-right:34px">${fresh.includes(c) ? '🆕 ' : ''}${esc(c.title)}</div>` +
      `<div class="s">${c.mrn ? '病歷號 ' + esc(c.mrn) + '｜' : ''}${isTodo ? (c.deadline ? '期限 ' + esc(c.deadline) : '送出 ' + esc(c.created)) : '已回傳 ' + esc(c.returned)}</div>` +
      (isTodo ? `<a class="btn" href="${esc(fillLink(c.link))}" style="margin-top:9px;background:#7c3aed;color:#fff;border-color:#7c3aed">✍ 填寫並簽章</a>` : '') + `</div>`;
    const R = vis('r:', r.replies || []), mgr = r.me.role === '管理者';
    let seenR = null; try { seenR = JSON.parse(ls.get('seenR_' + KEY) || 'null') } catch (e) {}
    const freshR = seenR ? R.filter(x => !seenR.includes(x.id)) : [];
    if (mgr) ls.set('seenR_' + KEY, JSON.stringify(R.map(x => x.id)));
    if (freshR.length && !first) showAlert(`<b style="color:#166534">✅ ${freshR.length} 份新的醫師回覆</b><br>${freshR.map(x => '・' + esc(x.doctor) + ' 醫師：' + esc(x.title)).join('<br>')}`);
    const mgrBox = !mgr ? '' : `<div style="margin-top:16px;font-weight:bold;color:#166534">👑 醫師回覆（管理者）</div>` +
      (R.length ? R.map(x => `<div class="card done" style="position:relative">${delBtn('r:' + x.id)}<div class="t" style="padding-right:34px">${freshR.includes(x) ? '🆕 ' : ''}${esc(x.doctor)} 醫師已回覆</div><div class="s">${esc(x.title)}${x.mrn ? '｜病歷號 ' + esc(x.mrn) : ''}<br>回覆時間 ${esc(x.returned)}</div>` +
        (x.view ? `<button class="btn" data-view="${esc(x.id)}" style="margin-top:9px">👁 查看回覆內容</button>` : `<div class="s" style="margin-top:6px">回覆內容已清除（舊版保留期限），請向承辦人索取</div>`) + `</div>`).join('') : '<div class="box ok">目前沒有醫師回覆</div>');
    const Q = r.queue || [], qWait = Q.filter(x => x.status === '待分派' || x.status === '錯誤');
    const qTag = s => ({ '待分派': '🟡 待分派', '已指派': '⏳ 建立中', '已建立': '✅ 已寄出', '錯誤': '⚠ 失敗', '已由承辦人處理': '✔ 承辦人已處理' })[s] || s;
    const dispBox = !mgr ? '' : `<details style="margin-top:16px"${qWait.length ? ' open' : ''}><summary style="font-weight:bold;color:#b45309;font-size:15px">📥 待分派判讀：胸部X光（${qWait.length}）</summary><div class="small" style="margin:4px 0 6px">感管室送來的結核病接觸者胸部X光檢查報告表。選擇判讀醫師後，系統會建立案件並寄 Email（醫師有 APP 也會推播）。</div>` +
      (Q.length ? Q.map(x => `<div class="card" style="border-left-color:${x.status === '待分派' || x.status === '錯誤' ? '#f59e0b' : '#16a34a'}"><div class="t">${esc(x.title)}（${x.count} 位）</div><div class="s">${esc(x.by)}｜${esc(x.at)}｜${qTag(x.status)}${x.doctor ? '｜' + esc(x.doctor) : ''}${x.msg ? '<br><span style="color:#b3261e">' + esc(x.msg) + '</span>' : ''}</div>` +
        (x.status === '待分派' || x.status === '錯誤' ? `<button class="btn" data-disp="${esc(x.qid)}" style="margin-top:9px;background:#f59e0b;color:#fff;border-color:#f59e0b">👩‍⚕️ 分派判讀醫師</button>` : '') + `</div>`).join('') : '<div class="box ok">目前沒有待分派的表單</div>') + `</details>`;
    window.__docs = r.docs || [];
    const A = vis('a:', r.active || []);
    const actBox = !mgr ? '' : `<details style="margin-top:16px"${A.length ? ' open' : ''}><summary style="font-weight:bold;color:#1d4ed8;font-size:15px">👑 所有處理中案件（${A.length}）</summary><div class="small" style="margin:4px 0 6px">管理者檢視：表單已隱蔽個資（姓名只留頭尾）</div>` +
      (A.length ? A.map(x => `<div class="card" style="position:relative">${delBtn('a:' + x.id)}<div class="t" style="padding-right:34px">${esc(x.title)}</div><div class="s">${x.mrn ? '病歷號 ' + esc(x.mrn) + '｜' : ''}${esc(x.doctor)}${x.mine ? '（我）' : ''}<br>${x.status === '已開啟' ? '👀 醫師已開啟 ' + esc(x.opened) : '⏳ 醫師尚未開啟'}${x.deadline ? '｜期限 ' + esc(x.deadline) : ''}<br><span style="color:#94a3b8">送出 ${esc(x.created)}${x.lastSent && x.lastSent !== x.created ? '｜最後提醒 ' + esc(x.lastSent) : ''}</span></div>` +
        `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px"><button class="btn" data-form="${esc(x.id)}" style="padding:7px 12px;font-size:14px">👁 查看表單</button>` +
        (x.app || x.mail ? `<button class="btn" data-remind="${esc(x.id)}" style="padding:7px 12px;font-size:14px">🔔 提醒醫師</button>` : '') +
        `<a class="btn" href="${esc(fillLink(x.link))}" style="padding:7px 12px;font-size:14px;background:#7c3aed;color:#fff;border-color:#7c3aed">✍ 開啟填寫</a></div></div>`).join('') : '<div class="box ok">目前沒有處理中的案件</div>') + `</details>`;
    $('app').innerHTML = head + a2hsBox() + pushBox() +
      (todo.length ? `<div style="font-weight:bold;color:#5b21b6;margin-top:8px">待回覆（${todo.length}）</div>` + todo.map(c => card(c, true)).join('') : `<div class="box ok">✅ 目前沒有待回覆的表單</div>`) +
      (done.length ? `<details style="margin-top:12px"><summary class="small" style="font-size:15px">已回傳（${done.length}）</summary>${done.map(c => card(c, false)).join('')}</details>` : '') + dispBox + actBox + mgrBox +
      (nHid ? `<div style="text-align:center;margin-top:16px"><button class="btn" id="hidTog" style="padding:7px 14px;font-size:14px">${showHid ? '🙈 隱藏已移除的項目' : `♻ 顯示已移除的項目（${nHid}）`}</button></div>` : '') +
      `<div class="small" style="margin-top:20px;text-align:center">版本 ${VERSION}</div>`;
  }
  if ($('hidTog')) $('hidTog').onclick = () => { window.__showHid = !window.__showHid; load() };
  $('app').querySelectorAll('[data-hide]').forEach(b => b.onclick = () => {
    let hid = []; try { hid = JSON.parse(ls.get('hid_' + KEY) || '[]') } catch (e) {}
    const k = b.dataset.hide, on = hid.includes(k);
    if (!on && k.startsWith('c:') && !b.closest('.card').classList.contains('done') && !confirm('這份表單還沒回覆，確定要從名單移除嗎？\n（只是不顯示，承辦人那邊不受影響；可在最下方「顯示已移除的項目」找回）')) return;
    hid = on ? hid.filter(x => x !== k) : hid.concat(k); ls.set('hid_' + KEY, JSON.stringify(hid.slice(-500))); load();
  });
  $('refBtn').onclick = load;
  $('app').querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewReply(b.dataset.view, b));
  $('app').querySelectorAll('[data-form]').forEach(b => b.onclick = () => viewReply(b.dataset.form, b, true));
  $('app').querySelectorAll('[data-disp]').forEach(b => b.onclick = () => dispatchDlg(b.dataset.disp));
  $('app').querySelectorAll('[data-remind]').forEach(b => b.onclick = async () => {
    if (!confirm('要提醒這位醫師填寫嗎？（APP 推播＋Email）')) return;
    const old = b.textContent; b.disabled = true; b.textContent = '傳送中…';
    try { const x = await call('appMgrCase', KEY, b.dataset.remind, 'remind'); showAlert(`<b style="color:#166534">✅ 已提醒醫師</b><br>${x.push ? 'APP 推播 ' + x.push + ' 支手機' : ''}${x.push && x.mail ? '＋' : ''}${x.mail ? 'Email' : ''}`) }
    catch (e) { showAlert(`<b style="color:#b3261e">提醒失敗</b><br>${esc(e.message)}`) }
    finally { b.disabled = false; b.textContent = old }
  });
  if ($('pushGo')) $('pushGo').onclick = enablePush;
  first = false;
}
load();
setInterval(() => { if (!document.hidden) load() }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load() });
</script>
</body>
</html>
